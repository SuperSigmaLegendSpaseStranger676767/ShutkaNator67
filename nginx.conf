events {
    worker_connections 1024;
}

http {
    upstream counter {
        server counter:5001;
    }

    upstream filter {
        server filter:5002;
    }

    upstream main_app {
        server main_app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://main_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /stats {
            proxy_pass http://counter/stats;
            proxy_set_header Host $host;
        }

        location /check {
            proxy_pass http://filter/check;
            proxy_set_header Host $host;
            proxy_set_header Content-Type application/json;
        }

        location /health {
            proxy_pass http://filter/health;
            proxy_set_header Host $host;
        }
    }
}