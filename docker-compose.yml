version: '3.8'

services:
  counter:
    image: shutkanator67-counter
    build: ./microservice_counter
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - shulkanator_network

  filter:
    image: shutkanator67-filter
    build: ./microservice_filter
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - shulkanator_network

  main_app:
    image: shutkanator67-main_app
    build: .
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    volumes:
      - ./Hah.txt:/app/Hah.txt
      - ./UserJokes.txt:/app/UserJokes.txt
    networks:
      - shulkanator_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - counter
      - filter
      - main_app
    deploy:
      replicas: 1
    networks:
      - shulkanator_network

networks:
  shulkanator_network:
    driver: overlay